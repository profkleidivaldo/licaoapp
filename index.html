<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escola Sabatina — Estudo da Lição</title>
<meta name="theme-color" content="#B26A29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lição">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--surf:#fff;--ink:#2a2118;--mute:#7a6c5c;--line:#e8dfd0;--acc:#B26A29;--accs:#f6e8d6;--ok:#2f7d4f;--verse:#fff7e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--surf:#221c16;--ink:#f0e8dc;--mute:#a89a88;--line:#3a3128;--acc:#e0a062;--accs:#3a2c1d;--ok:#6cc48c;--verse:#2b2218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--surf:#221c16;--ink:#f0e8dc;--mute:#a89a88;--line:#3a3128;--acc:#e0a062;--accs:#3a2c1d;--ok:#6cc48c;--verse:#2b2218;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:8px;align-items:center;padding:12px 0 8px}
.top .ttl{flex:1;min-width:0}
.top small{color:var(--mute);font-size:12px;display:block}
.top h1{font:600 17px/1.2 Lora,Georgia,serif;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
select{max-width:100%}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tab{flex:1;min-width:58px;text-align:center;padding:7px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:13px;position:relative}
.tab b{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.on b{color:#ffffffcc}
.tab.done::after{content:"✓";position:absolute;top:-6px;right:-3px;background:var(--ok);color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;line-height:17px}
.tab.today{outline:2px dashed var(--acc);outline-offset:2px}
main{padding:20px 0 48px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--accs);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
h2{font:600 28px/1.2 Lora,Georgia,serif;margin:4px 0 18px}
.read{font:400 var(--fs,18px)/1.75 Lora,Georgia,serif}
.read p{margin:0 0 1.1em}
.read h3{font:600 1.05em Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin:1.6em 0 .5em}
.ref{background:var(--accs);color:var(--acc);padding:0 5px;border-radius:6px;font:600 .82em Inter,sans-serif;white-space:nowrap}
.verse{background:var(--verse);border-left:4px solid var(--acc);padding:14px 18px;border-radius:0 14px 14px 0;margin:0 0 1.4em;font-style:italic}
.verse span{display:block;font:600 11px Inter,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:4px}
.q{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin:1.6em 0}
.q .h{display:flex;gap:12px;align-items:flex-start}
.q .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:600 14px Inter,sans-serif}
.q.reflect .n{background:var(--ok)}
.q .t{font:600 1em/1.5 Inter,sans-serif;font-size:16px;margin:3px 0 0}
.q small{display:block;color:var(--mute);font:500 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
textarea{width:100%;margin-top:12px;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.5 Inter,sans-serif;background:var(--bg);color:var(--ink)}
textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.nav{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.nav .go{flex:1;background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600;padding:11px}
.nav .go.undo{background:var(--surf);color:var(--ok)}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
.intro{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:var(--mute)}
@media (max-width:480px){h2{font-size:23px}.read{--fs:17px}}

:root{--hl:#ffe98a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#6a5714}}
:root[data-theme="dark"]{--hl:#6a5714}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.ref{cursor:pointer;text-decoration:underline dotted}
.vn{user-select:none;-webkit-user-select:none}
#sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sc{background:var(--bg);width:min(760px,100%);max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font:600 18px Lora,Georgia,serif}
#sv{display:flex;gap:6px;padding:0 16px 8px}
.vb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#sbody{overflow:auto;padding:4px 16px 12px;flex:1;-webkit-overflow-scrolling:touch}
#sf{display:flex;gap:8px;padding:8px 16px 14px}
#sf button{flex:1}
.bv{font:var(--fs,18px)/1.7 Lora,Georgia,serif;margin:0 0 8px;padding:4px 8px;border-radius:8px}
.bv.sel{background:var(--accs)}
.bv .vn{font:600 11px Inter,sans-serif;color:var(--acc);margin-right:6px;vertical-align:super}
.mute{color:var(--mute);font-size:14px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.orow small{display:block;color:var(--mute)}
#sbody .go{width:100%;margin-top:14px;background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600;padding:11px}
#tool{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:none;gap:8px;align-items:center;max-width:94%;box-shadow:0 6px 24px #0005}
#tool.on{display:flex}
#tl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
#tool button{background:var(--acc);color:#fff;border-color:transparent;font-weight:600}
#tool #tc{background:transparent;color:var(--bg)}

.hero{border-radius:16px;overflow:hidden;background:var(--surf);border:1px solid var(--line);margin-bottom:16px}
.hero img{display:block;width:100%;height:210px;object-fit:cover;background:var(--accs)}
.hero.slim img{height:92px}
.hc{padding:14px 16px}
.hc small{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.hc b{display:block;font:600 22px/1.25 Lora,Georgia,serif;margin-bottom:4px}
.hc span{color:var(--mute);font-size:14px}
.hc a{color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div class="ttl"><small id="qt"></small><h1 id="wt"></h1></div>
<button id="fm" title="Diminuir letra" aria-label="Diminuir letra">A−</button>
<button id="fp" title="Aumentar letra" aria-label="Aumentar letra">A+</button>
<button id="of" title="Uso offline" aria-label="Uso offline">⤓</button>
<button id="th" title="Alternar tema" aria-label="Alternar tema">◐</button></div>
<div class="top" style="padding-top:0"><select id="ws" aria-label="Escolher lição"></select><button id="tdy">Hoje</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="tabs" id="tabs"></div>
</div></header>
<main><div class="wrap" id="app"><p class="intro">Carregando a lição…</p></div></main>
<div id="sheet" hidden><div class="sc"><div class="sh"><span id="st"></span><button id="sx" aria-label="Fechar">✕</button></div><div id="sv"></div><div id="sbody" class="hlz"></div><div id="sf"></div></div></div>
<div id="toast" role="status"></div>
<div id="tool"><span id="tl"></span><button id="tg"></button><button id="tc" aria-label="Fechar">✕</button></div>
<script>
let D,CAP={};const BK=[["Gn","Gênesis",50],["Ex","Êxodo",40],["Lv","Levítico",27],["Nm","Números",36],["Dt","Deuteronômio",34],["Js","Josué",24],["Jz","Juízes",21],["Rt","Rute",4],["1Sm","1 Samuel",31],["2Sm","2 Samuel",24],["1Rs","1 Reis",22],["2Rs","2 Reis",25],["1Cr","1 Crônicas",29],["2Cr","2 Crônicas",36],["Ed","Esdras",10],["Ne","Neemias",13],["Et","Ester",10],["Jó","Jó",42],["Sl","Salmos",150],["Pv","Provérbios",31],["Ec","Eclesiastes",12],["Ct","Cantares",8],["Is","Isaías",66],["Jr","Jeremias",52],["Lm","Lamentações",5],["Ez","Ezequiel",48],["Dn","Daniel",12],["Os","Oséias",14],["Jl","Joel",3],["Am","Amós",9],["Ob","Obadias",1],["Jn","Jonas",4],["Mq","Miquéias",7],["Na","Naum",3],["Hc","Habacuque",3],["Sf","Sofonias",3],["Ag","Ageu",2],["Zc","Zacarias",14],["Ml","Malaquias",4],["Mt","Mateus",28],["Mc","Marcos",16],["Lc","Lucas",24],["Jo","João",21],["At","Atos",28],["Rm","Romanos",16],["1Co","1 Coríntios",16],["2Co","2 Coríntios",13],["Gl","Gálatas",6],["Ef","Efésios",6],["Fp","Filipenses",4],["Cl","Colossenses",4],["1Ts","1 Tessalonicenses",5],["2Ts","2 Tessalonicenses",3],["1Tm","1 Timóteo",6],["2Tm","2 Timóteo",4],["Tt","Tito",3],["Fm","Filemom",1],["Hb","Hebreus",13],["Tg","Tiago",5],["1Pe","1 Pedro",5],["2Pe","2 Pedro",3],["1Jo","1 João",5],["2Jo","2 João",1],["3Jo","3 João",1],["Jd","Judas",1],["Ap","Apocalipse",22]];
const DAYS=['Sábado','Domingo','Segunda','Terça','Quarta','Quinta','Sexta'];
const ALIAS={'Êx':1};BK.forEach((b,i)=>{ALIAS[b[0]]=i;ALIAS[b[1]]=i;ALIAS[b[1].replace(' ','')]=i});
const REF=new RegExp('(?<![\\wÀ-ú])('+Object.keys(ALIAS).sort((a,b)=>b.length-a.length).join('|')+')\\.? ?(\\d{1,3}):(\\d{1,3})(?:[-–]\\d{1,3})?(?:(?:, ?| e )\\d{1,3}(?:[-–]\\d{1,3})?(?![:\\d]))*','g');
const KEY='ess:v1';
let S={read:{},notes:{},fs:18,theme:'',ver:'aa'},W=0,Dy=0;
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pd=s=>{const[a,b,c]=s.split('/');return new Date(+c,b-1,+a)};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(REF,(m,b)=>`<span class="ref" role="button" data-b="${ALIAS[b]}" data-s="${m.slice(b.length).replace(/^\.? ?/,'')}">${m}</span>`);
function render(md,wi,di){
  let qi=0,pi=0;
  return md.split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return'';
    if(b[0]=='>'){const t=b.split('\n').map(l=>l.replace(/^>\s?/,'')).filter(Boolean);const lab=t[0].length<40&&t.length>1?t.shift():'Verso';return`<div class="verse"><span>${inl(lab)}</span>${inl(t.join(' '))}</div>`}
    const q=b.match(/^`([\s\S]+)`$/);
    if(q){const k=wi+'-'+di+'-'+(qi++);const m=q[1].match(/^(\d+)\.\s*([\s\S]*)$/);
      const num=m?m[1]:'?',txt=m?m[2]:q[1];
      return`<div class="q ${m?'':'reflect'}"><div class="h"><div class="n">${m?num:'✎'}</div><div><small>${m?'Pergunta':'Para refletir'}</small><div class="t" data-hs="L:q${k}">${inl(txt)}</div></div></div><textarea data-k="${k}" placeholder="Escreva sua resposta ou reflexão…">${esc(S.notes[k]||'')}</textarea></div>`}
    const h=b.match(/^#{2,4}\s+(.*)/);if(h)return`<h3>${inl(h[1])}</h3>`;
    return`<p data-hs="L:${wi}-${di}-${pi++}">${inl(b).replace(/\n/g,'<br>')}</p>`}).join('');
}
function weekRead(wi){return D.weeks[wi].days.filter((_,i)=>S.read[wi+'-'+i]).length}
function draw(){
  const w=D.weeks[W],d=w.days[Dy];
  $('qt').textContent=D.title+' · '+D.human;
  $('wt').textContent='Lição '+w.n+' — '+w.title;
  $('ws').innerHTML=D.weeks.map((x,i)=>`<option value="${i}"${i==W?' selected':''}>Lição ${x.n} · ${x.title} (${x.start.slice(0,5)}) ${weekRead(i)==7?'✓':''}</option>`).join('');
  const t=new Date();t.setHours(0,0,0,0);
  const ti=Math.floor((t-pd(w.start))/864e5);
  $('tabs').innerHTML=w.days.map((_,i)=>`<button class="tab${i==Dy?' on':''}${S.read[W+'-'+i]?' done':''}${i==ti?' today':''}" data-d="${i}">${DAYS[i].slice(0,3)}<b>${addDay(w.start,i)}</b></button>`).join('');
  $('pb').style.width=(weekRead(W)/7*100)+'%';
  const words=d.md.split(/\s+/).length,min=Math.max(1,Math.round(words/170));
  const done=!!S.read[W+'-'+Dy];
  $('app').innerHTML=`${hero(W,Dy)}<div class="meta"><span class="chip">${DAYS[Dy]} · ${addDay(w.start,Dy,1)}</span><span class="chip">≈ ${min} min de leitura</span><span class="chip">${weekRead(W)}/7 dias estudados</span></div>
  <h2>${inl(d.t)}</h2>${Dy==0&&w.reads?`<div class="intro"><strong>Leituras da semana:</strong> ${inl(w.reads)}</div>`:''}
  <div class="read hlz" style="--fs:${S.fs}px">${render(d.md,W,Dy)}</div>
  <div class="nav"><button id="pv" ${Dy==0&&W==0?'disabled':''}>← Anterior</button><button class="go${done?' undo':''}" id="mk">${done?'✓ Estudado (desfazer)':'Marcar como estudado'}</button><button id="nx" ${Dy==6&&W==D.weeks.length-1?'disabled':''}>Próximo →</button></div>
  <p class="hint">Selecione um trecho para grifar · toque numa referência bíblica para ler o versículo · respostas e grifos ficam salvos só neste aparelho.</p>`;applyAll($('app'));
}
function addDay(s,i,long){const x=pd(s);x.setDate(x.getDate()+i);return long?x.toLocaleDateString('pt-BR',{day:'numeric',month:'long'}):x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function go(w,d){W=w;Dy=d;draw();scrollTo({top:0,behavior:'smooth'})}
function today(){const t=new Date();t.setHours(0,0,0,0);
  let wi=D.weeks.findIndex(w=>t>=pd(w.start)&&t<=pd(w.end));
  if(wi<0)wi=t<pd(D.weeks[0].start)?0:D.weeks.length-1;
  const di=Math.min(6,Math.max(0,Math.floor((t-pd(D.weeks[wi].start))/864e5)));go(wi,di)}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');if(tb)return go(W,+tb.dataset.d);
  const id=e.target.id;
  if(id=='pv'){Dy?go(W,Dy-1):go(W-1,6)}
  if(id=='nx'){Dy<6?go(W,Dy+1):go(W+1,0)}
  if(id=='mk'){const k=W+'-'+Dy;S.read[k]=!S.read[k];if(!S.read[k])delete S.read[k];save();draw();if(S.read[k]&&Dy<6)setTimeout(()=>go(W,Dy+1),350)}
  if(id=='tdy')today();
  if(id=='fp'||id=='fm'){S.fs=Math.min(26,Math.max(14,S.fs+(id=='fp'?2:-2)));save();draw()}
  if(id=='th'){const dark=getComputedStyle(document.documentElement).colorScheme=='dark';S.theme=dark?'light':'dark';apply();save()}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.k){S.notes[e.target.dataset.k]=e.target.value;clearTimeout(window._t);window._t=setTimeout(save,400)}});
$('ws').onchange=e=>go(+e.target.value,0);
function apply(){if(S.theme)document.documentElement.dataset.theme=S.theme}
/* ===== grifos (por posição de caracteres; funcionam na lição e nos versículos) ===== */
const HLK='ess:hl';let HL={};try{HL=JSON.parse(localStorage.getItem(HLK)||'{}')}catch(e){}
const saveHL=()=>{try{localStorage.setItem(HLK,JSON.stringify(HL))}catch(e){}};
const tns=el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.vn')?2:1}),a=[];let n;while(n=w.nextNode())a.push(n);return a};
const scopeLen=el=>tns(el).reduce((a,n)=>a+n.length,0);
function offOf(el,node,o){const pt=document.createRange();pt.setStart(node,o);let t=0;for(const n of tns(el)){if(n===node)return t+o;if(pt.comparePoint(n,n.length)<=0)t+=n.length;else break}return t}
function applyScope(el){
  el.querySelectorAll('mark.hl').forEach(m=>m.replaceWith(...m.childNodes));el.normalize();
  (HL[el.dataset.hs]||[]).forEach(([s,e],i)=>{let pos=0;for(const n of tns(el)){const l=n.length,a=Math.max(s-pos,0),b=Math.min(e-pos,l);
    if(b>a){const r=document.createRange();r.setStart(n,a);r.setEnd(n,b);const m=document.createElement('mark');m.className='hl';m.dataset.i=i;r.surroundContents(m)}
    pos+=l;if(pos>=e)break}});
}
const applyAll=root=>root.querySelectorAll('[data-hs]').forEach(applyScope);
const merge=a=>{a.sort((x,y)=>x[0]-y[0]);const o=[];for(const v of a){const l=o[o.length-1];if(l&&v[0]<=l[1])l[1]=Math.max(l[1],v[1]);else o.push(v.slice())}return o};
let pend=null,selT;
const hideTool=()=>{pend=null;$('tool').classList.remove('on')};
const showTool=(l,b)=>{$('tl').textContent=l;$('tg').textContent=b;$('tool').classList.add('on')};
function evalSel(){
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed||(document.activeElement&&document.activeElement.tagName=='TEXTAREA')){if(!pend||pend.t=='add')hideTool();return}
  const r=sel.getRangeAt(0),ce=r.commonAncestorContainer,el=ce.nodeType==1?ce:ce.parentElement,z=el&&el.closest('.hlz');
  if(!z){hideTool();return}
  const out=[];
  z.querySelectorAll('[data-hs]').forEach(s=>{if(!r.intersectsNode(s))return;const er=document.createRange();er.selectNodeContents(s);
    const a=r.compareBoundaryPoints(Range.START_TO_START,er)<0?0:offOf(s,r.startContainer,r.startOffset),
          b=r.compareBoundaryPoints(Range.END_TO_END,er)>0?scopeLen(s):offOf(s,r.endContainer,r.endOffset);
    if(b>a)out.push([s.dataset.hs,a,b])});
  if(!out.length){hideTool();return}
  pend={t:'add',out};const t=sel.toString().trim();showTool('“'+(t.length>50?t.slice(0,50)+'…':t)+'”','Grifar');
}
document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(evalSel,220)});
$('tg').onclick=()=>{if(!pend)return;let ids;
  if(pend.t=='add'){ids=pend.out.map(o=>o[0]);pend.out.forEach(([id,a,b])=>{HL[id]=merge([...(HL[id]||[]),[a,b]])})}
  else{ids=[pend.id];const l=HL[pend.id];l.splice(pend.i,1);if(!l.length)delete HL[pend.id]}
  saveHL();document.querySelectorAll('[data-hs]').forEach(s=>{if(ids.includes(s.dataset.hs))applyScope(s)});
  getSelection().removeAllRanges();hideTool()};
$('tc').onclick=()=>{getSelection().removeAllRanges();hideTool()};
document.addEventListener('click',e=>{
  if(!getSelection().isCollapsed)return;
  const r=e.target.closest('.ref');if(r)return openRef(r.dataset.b,r.dataset.s);
  const m=e.target.closest('mark.hl');if(m){pend={t:'del',id:m.closest('[data-hs]').dataset.hs,i:+m.dataset.i};showTool('Remover este grifo?','Remover')}
});

/* ===== Bíblia (mesmas versões e fonte do projeto da Bíblia) ===== */
const VERS=[['acf','ACF','Almeida Corrigida Fiel'],['aa','AA','Almeida Revisada Imprensa Bíblica'],['nvi','NVI','Nova Versão Internacional']];
const VURL=id=>`https://raw.githubusercontent.com/thiagobodruk/biblia/master/json/${id}.json`;
const LURL='data/licao.json',vd={};let bib=null;
async function loadBible(id,force){
  if(vd[id]&&!force)return vd[id];
  const url=VURL(id);let c=null;try{c=await caches.open('ess-biblia-v1')}catch(e){}
  let res=!force&&c?await c.match(url):null;
  if(!res){res=await fetch(url);if(!res.ok)throw 0;if(c)try{await c.put(url,res.clone())}catch(e){}}
  const raw=await res.json(),bs=Array.isArray(raw)?raw:Object.values(raw);
  const d=bs.map(b=>(b.chapters||[]).map(ch=>(Array.isArray(ch)?ch:(ch.verses||[])).map(v=>typeof v=='string'?v:(v.text||''))));
  if(d.length<66)throw 0;return vd[id]=d;
}
const SK='data/licao-sync.json';
async function loadLesson(){
  let c=null;try{c=await caches.open('ess-licoes-v1')}catch(e){}
  let a=null,b=null;
  try{const r=await fetch(LURL,{cache:'no-cache'});if(r.ok){if(c)try{await c.put(LURL,r.clone())}catch(e){}a=await r.json()}}catch(e){}
  if(!a)try{const h=c&&await c.match(LURL);if(h)a=await h.json()}catch(e){}
  try{const h=c&&await c.match(SK);if(h)b=await h.json()}catch(e){}
  const d=b&&(!a||b.id>=a.id)?b:a;if(!d)throw 0;return d;
}
function spec2set(s){const set=new Set();s.split(/,| e /).forEach((p,i)=>{p=(i?p:p.replace(/^\d+:/,'')).trim();const m=p.match(/^(\d+)(?:[-–](\d+))?/);if(m)for(let v=+m[1];v<=+(m[2]||m[1]);v++)set.add(v)});return set}
function openRef(b,s){b=+b;const c=parseInt(s);bib={b,c,vs:spec2set(s),full:false,label:BK[b][1]+' '+s};showBible()}
const closeSheet=()=>{$('sheet').hidden=true;bib=null;hideTool()};
async function showBible(){
  const ver=S.ver,bd=$('sbody');
  $('sheet').hidden=false;$('st').textContent=bib.label;
  $('sv').innerHTML=VERS.map(v=>`<button class="vb${v[0]==ver?' on':''}" data-v="${v[0]}" title="${v[2]}">${v[1]}</button>`).join('');
  $('sf').innerHTML='';
  if(!vd[ver])bd.innerHTML='<p class="mute">Carregando… (só na primeira vez; depois funciona offline)</p>';
  try{
    const d=await loadBible(ver);if(ver!=S.ver||!bib)return;
    const ch=(d[bib.b][bib.c-1]||[]).map((t,i)=>[i+1,t]).filter(([n])=>bib.full||!bib.vs.size||bib.vs.has(n));
    bd.innerHTML=ch.map(([n,t])=>`<div class="bv${bib.vs.has(n)?' sel':''}" style="--fs:${S.fs}px" data-hs="B:${ver}:${bib.b}:${bib.c}:${n}"><b class="vn">${n}</b>${esc(String(t).trim())}</div>`).join('')||'<p>Passagem não encontrada nesta versão.</p>';
    applyAll(bd);
    $('sf').innerHTML=bib.full?'<button data-a="pc">← Anterior</button><button data-a="nc">Próximo →</button>':`<button data-a="full">Ler o capítulo ${bib.c} completo</button>`;
    if(bib.full){const f=bd.querySelector('.sel');if(f)f.scrollIntoView({block:'center'})}else bd.scrollTop=0;
  }catch(e){bd.innerHTML='<p>Não foi possível carregar esta versão. Conecte-se à internet uma vez para baixá-la; depois ela funciona offline.</p><button data-a="retry">Tentar de novo</button>'}
}
/* ===== uso offline ===== */
const inCache=async(n,u)=>{try{return !!(await(await caches.open(n)).match(u))}catch(e){return false}};
async function showOffline(){
  bib=null;if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  $('sheet').hidden=false;$('st').textContent='Uso offline';$('sv').innerHTML='';$('sf').innerHTML='';
  const rows=[['Lição: '+D.title+' · '+D.human,LURL,'ess-licoes-v1','L'],...VERS.map(v=>['Bíblia '+v[1],VURL(v[0]),'ess-biblia-v1',v[0]])];
  const st=await Promise.all(rows.map(r=>inCache(r[2],r[1])));
  $('sbody').innerHTML='<p class="mute">Baixe uma vez com internet; depois a lição, os versículos e seus grifos abrem sem conexão.</p>'+rows.map((r,i)=>`<div class="orow"><div><strong>${r[0]}</strong><small>${st[i]?'✓ salvo neste aparelho':'ainda não salvo'}</small></div><button data-o="${r[3]}">${st[i]?'Atualizar':'Baixar'}</button></div>`).join('')+'<button class="go" data-o="all">Salvar tudo para offline</button>';
}
async function doOff(k,btn){
  btn.disabled=true;btn.textContent='Baixando…';
  try{
    if(k=='L'||k=='all'){if(!navigator.onLine)throw 0;if(!(await autoSync(true))){adopt(await loadLesson());draw()}Object.values(CAP[D.id]||{}).forEach(c=>c.img&&fetch(c.img,{mode:'no-cors'}).catch(()=>{}))}
    for(const v of VERS)if(k==v[0]||k=='all')await loadBible(v[0],true);
    showOffline();
  }catch(e){btn.disabled=false;btn.textContent='Tentar de novo';$('sbody').insertAdjacentHTML('afterbegin','<p style="color:#c0392b">Falha no download. Verifique a conexão.</p>')}
}
$('sheet').addEventListener('click',e=>{
  const t=e.target;if(t.id=='sheet'||t.id=='sx')return closeSheet();
  if(t.dataset.v){S.ver=t.dataset.v;save();showBible()}
  if(t.dataset.o)doOff(t.dataset.o,t);
  const a=t.dataset.a;if(!a)return;
  if(a=='full'){bib.full=true;showBible()}
  if(a=='retry')showBible();
  if(a=='pc'&&bib.c>1){bib.c--;bib.vs=new Set();bib.label=BK[bib.b][1]+' '+bib.c;showBible()}
  if(a=='nc'&&bib.c<BK[bib.b][2]){bib.c++;bib.vs=new Set();bib.label=BK[bib.b][1]+' '+bib.c;showBible()}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});
$('of').onclick=showOffline;
/*SYNC*/
const GH='https://raw.githubusercontent.com/Adventech/sabbath-school-lessons/master/src/pt/';
const pdate=x=>{const m=(x||'').match(/(\d\d)\/(\d\d)\/(\d{4})/);return m?new Date(+m[3],m[2]-1,+m[1]):null};
const yv=(t,k)=>{const m=t.match(new RegExp('^\\s*'+k+':\\s*"?([^"\\n]*)"?','m'));return m?m[1].trim():''};
async function ghText(p){const r=await fetch(GH+p);if(!r.ok)throw 0;return r.text()}
async function findQuarter(){
  const t=new Date();t.setHours(0,0,0,0);const y=t.getFullYear(),q=Math.ceil((t.getMonth()+1)/3),ids=[];
  for(const dq of[1,0,-1]){let Y=y,Q=q+dq;if(Q>4){Q=1;Y++}if(Q<1){Q=4;Y--}ids.push(Y+'-0'+Q)}
  const inf=await Promise.all(ids.map(id=>ghText(id+'/info.yml').then(x=>[id,x]).catch(()=>null)));
  let best=null;
  for(const i of inf){if(!i)continue;const a=pdate(yv(i[1],'start_date')),b=pdate(yv(i[1],'end_date'));if(a&&b&&a<=t&&t<=b)return i;if(a&&a<=t&&(!best||a>best.a))best={a,i}}
  return best&&best.i;
}
function parseDay(raw,first){
  const m=raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);let body=(m?m[2]:raw).trim().replace(/<[^>]+>/g,''),reads='';
  if(first){const r=body.match(/###\s*Leituras da semana\s*\n(.*)/);if(r){reads=r[1].trim();body=body.slice(0,r.index).trim()}}
  return{t:m?yv(m[1],'title'):'',md:body,reads};
}
async function fetchQuarter(id,info){
  const ws=await Promise.all(Array.from({length:13},(_,i)=>i+1).map(async n=>{
    const p=id+'/'+String(n).padStart(2,'0')+'/';let wi;
    try{wi=await ghText(p+'info.yml')}catch(e){return null}
    const days=await Promise.all([1,2,3,4,5,6,7].map(i=>ghText(p+'0'+i+'.md').then(r=>parseDay(r,i==1))));
    return{n,title:yv(wi,'title'),start:yv(wi,'start_date'),end:yv(wi,'end_date'),reads:days[0].reads,days:days.map(x=>({t:x.t,md:x.md}))};
  }));
  const weeks=ws.filter(Boolean);if(weeks.length<4)throw 0;
  return{id,title:yv(info,'title'),human:yv(info,'human_date'),weeks};
}
/*ENDSYNC*/
function adopt(d){
  if(S.qid&&S.qid!=d.id){
    try{localStorage.setItem('ess:arq:'+S.qid,JSON.stringify({read:S.read,notes:S.notes,hl:Object.fromEntries(Object.entries(HL).filter(e=>e[0][0]=='L'))}))}catch(e){}
    S.read={};S.notes={};for(const k in HL)if(k[0]=='L')delete HL[k];saveHL();
  }
  S.qid=d.id;save();D=d;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),4500)}
let chk=0;
async function autoSync(force){
  if(!navigator.onLine)return false;
  if(!force&&Date.now()-chk<36e5)return false;chk=Date.now();
  try{
    const f=await findQuarter();if(!f)return false;
    const id=f[0],last=+localStorage.getItem('ess:sync:'+id)||0;
    if(!force&&D&&D.id==id&&Date.now()-last<2592e5)return false;
    const nd=await fetchQuarter(id,f[1]);
    try{const c=await caches.open('ess-licoes-v1');await c.put(SK,new Response(JSON.stringify(nd),{headers:{'Content-Type':'application/json'}}))}catch(e){}
    try{localStorage.setItem('ess:sync:'+id,Date.now())}catch(e){}
    try{CAP=await(await fetch('data/capas.json',{cache:'no-cache'})).json()}catch(e){}
    const nq=D.id!=id,ch=nq||JSON.stringify(nd.weeks)!=JSON.stringify(D.weeks);
    adopt(nd);
    if(nq)today();else if(!(document.activeElement&&document.activeElement.tagName=='TEXTAREA'))draw();
    if(ch)toast(nq?'Novo trimestre: '+nd.title:'Lição atualizada');
    return true;
  }catch(e){return false}
}
function hero(wi,di){
  const w=D.weeks[wi],c=(CAP[D.id]||{})[w.n]||{},im=c.img||GH+D.id+'/cover.png',per=c.periodo||addDay(w.start,0,1)+' a '+addDay(w.end,0,1);
  return`<div class="hero${di?' slim':''}"><img src="${esc(im)}" alt="Capa da lição ${w.n}" referrerpolicy="no-referrer" onerror="this.style.display='none'">${di?'':`<div class="hc"><small>Lição ${w.n} · ${esc(D.title)}</small><b>${esc(w.title)}</b><span>${per}${c.link?` · <a href="${esc(c.link)}" target="_blank" rel="noopener">ver no CPB mais ↗</a>`:''}</span></div>`}</div>`;
}
addEventListener('online',()=>{chk=0;autoSync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
apply();
Promise.all([loadLesson(),fetch('data/capas.json').then(r=>r.json()).catch(()=>({}))]).then(([d,c])=>{CAP=c;adopt(d);today();autoSync()}).catch(()=>{$('app').innerHTML='<p class="intro">Não foi possível carregar a lição. Conecte-se à internet uma vez para salvá-la neste aparelho.</p>'});
</script>
